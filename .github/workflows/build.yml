name: Build Speedy Scandocs

# Trigger: push a version tag like v1.0 or v1.2.3
# git tag v1.0 && git push --tags
on:
  push:
    tags:
      - 'v*'

jobs:

  # ── Windows build ────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller build/windows/scandocs.spec --clean

      - name: Upload Windows app folder
        uses: actions/upload-artifact@v4
        with:
          name: SpeedyScandocs-Windows
          path: dist/SpeedyScandocs/
          retention-days: 30

  # ── macOS build ──────────────────────────────────────────────────────────
  build-mac:
    runs-on: macos-13       # Intel runner — app also runs on Apple Silicon via Rosetta 2
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tesseract (needed to bundle binary into app)
        run: brew install tesseract

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller build/mac/scandocs_mac.spec --clean

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          create-dmg \
            --volname "Speedy Scandocs" \
            --volicon "assets/GDJ Logo.png" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "SpeedyScandocs.app" 175 190 \
            --hide-extension "SpeedyScandocs.app" \
            --app-drop-link 425 190 \
            "build/mac/SpeedyScandocs.dmg" \
            "dist/SpeedyScandocs.app"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: SpeedyScandocs-Mac
          path: build/mac/SpeedyScandocs.dmg
          retention-days: 30
