name: Build Speedy Scandocs

# Trigger: push a version tag like v1.0 or v1.2.3
# git tag v1.3 && git push --tags
on:
  push:
    tags:
      - 'v*'

jobs:

  # ── Windows build ────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tesseract (needed to bundle into app)
        run: |
          $releases = Invoke-RestMethod 'https://api.github.com/repos/UB-Mannheim/tesseract/releases/latest'
          $asset = $releases.assets | Where-Object { $_.name -match 'tesseract-ocr-w64-setup.*\.exe$' } | Select-Object -First 1
          Write-Host "Downloading $($asset.name)..."
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile 'tesseract-setup.exe' -UseBasicParsing
          Start-Process -FilePath 'tesseract-setup.exe' -ArgumentList '/S' -Wait
          Write-Host "Tesseract installed."
        shell: pwsh

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller build/windows/scandocs.spec --clean -y

      - name: Install Inno Setup and build installer
        run: |
          choco install innosetup --yes --no-progress
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup 6\ISCC.exe" | Select-Object -First 1
          if (-not $iscc) { Write-Error "ISCC.exe not found"; exit 1 }
          Write-Host "Using: $($iscc.FullName)"
          & $iscc.FullName "build\windows\installer.iss"
        shell: pwsh

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: SpeedyScandocs-Windows-Setup
          path: build/windows/Output/SpeedyScandocsSetup.exe
          retention-days: 90

  # ── macOS build ──────────────────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tesseract (needed to bundle binary into app)
        run: brew install tesseract

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller build/mac/scandocs_mac.spec --clean -y

      - name: Ad-hoc sign the .app
        # Ad-hoc signing (no Apple Developer cert) gives the bundle a stable
        # code-design identity. It does NOT bypass Gatekeeper — users still
        # need to "Open Anyway" once via Privacy & Security on first launch
        # — but it reduces the "SpeedyScandocs is damaged and can't be opened"
        # error on Apple Silicon, which strikes unsigned PyInstaller bundles.
        # When we move to a paid Developer ID + notarization, replace this
        # step with codesign using the real identity + xcrun notarytool.
        run: |
          codesign --force --deep --sign - dist/SpeedyScandocs.app
          codesign --verify --verbose dist/SpeedyScandocs.app

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          create-dmg \
            --volname "Speedy Scandocs" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "SpeedyScandocs.app" 175 190 \
            --hide-extension "SpeedyScandocs.app" \
            --app-drop-link 425 190 \
            "build/mac/SpeedyScandocs.dmg" \
            "dist/SpeedyScandocs.app"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: SpeedyScandocs-Mac
          path: build/mac/SpeedyScandocs.dmg
          retention-days: 90

  # ── Publish GitHub Release with both files ───────────────────────────────
  release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: SpeedyScandocs-Windows-Setup
          path: release/

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: SpeedyScandocs-Mac
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: "Speedy Scandocs ${{ github.ref_name }}"
          body: |
            ## Speedy Scandocs ${{ github.ref_name }}

            ### Windows
            Download and run **SpeedyScandocsSetup.exe** — standard installer wizard.

            ### Mac
            Download **SpeedyScandocs.dmg** — open it and drag the app to Applications.
          files: |
            release/SpeedyScandocsSetup.exe
            release/SpeedyScandocs.dmg
